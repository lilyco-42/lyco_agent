name: Build & Test

# lycore = 纯 Rust (无 GUI): 交叉编译只需 gcc-aarch64-linux-gnu
# (rusqlite bundled 编译 sqlite3.c, reqwest 走 rustls-no-provider + ring, 均无系统库依赖)
#
# jobs:
#   test    — 主机 cargo test (16 个 ignored 测试需真知识包/llama-server, 跳过)
#   build   — x86_64 + aarch64 Linux 矩阵, 产物 upload-artifact
#   release — 打 tag (v*.*.*) 时: 构建 aarch64 + 源码包, 上传到 GitHub Release
#             (release 附件是 RADXA_SETUP 路径 A/B 的权威来源, CI 构建即杜绝与源码漂移)

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build (deps cache warm)
        run: cargo build --release
      - name: Test
        run: cargo test --release

  build:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: lycore/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lycore-${{ matrix.target }}
          path: lycore/target/${{ matrix.target }}/release/lycore
          if-no-files-found: error

  release:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lycore-aarch64-unknown-linux-gnu
          path: dist_dl
      - name: Stage assets
        run: |
          mkdir -p out
          cp dist_dl/lycore out/lycore-aarch64
          chmod +x out/lycore-aarch64
          # 源码包: 已跟踪文件 (与 git archive HEAD 一致, 含演示知识包与训练脚本)
          git archive --format=tar.gz -o out/lyco_radxa_src.tar.gz HEAD
          ls -la out/
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            out/lycore-aarch64 out/lyco_radxa_src.tar.gz --clobber
