name: Build & Test

# lycore = 纯 Rust (无 GUI): 交叉编译只需 gcc-aarch64-linux-gnu
# (rusqlite bundled 编译 sqlite3.c, reqwest 走 rustls-no-provider + ring, 均无系统库依赖)
#
# jobs:
#   test    — 主机 cargo test (16 个 ignored 测试需真知识包/llama-server, 跳过)
#   build   — x86_64 + aarch64 Linux 矩阵, 产物 upload-artifact
#   release — 打 tag (v*.*.*) 时: 构建 aarch64 + 源码包, 上传到 GitHub Release
#             (release 附件是 lyco-ops/RADXA_SETUP.md 路径 A/B 的权威来源, CI 构建即杜绝与源码漂移)

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Fetch out-of-repo fixtures (smoke + vnn weights)
        # 脚本在仓库根 scripts/, 而 job defaults 把 working-directory 设为 lycore/
        # → 必须显式覆盖回仓库根, 否则 CI 找不到脚本 (2026-09-20 修复)
        working-directory: .
        run: bash scripts/fetch_fixtures.sh
      - name: Build (deps cache warm)
        run: cargo build --release
      - name: Test
        run: cargo test --release

  build:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: lycore/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lycore-${{ matrix.target }}
          path: lycore/target/${{ matrix.target }}/release/lycore
          if-no-files-found: error

  # ══ help-parse 池回归 ══════════════════════════════════════════════
  #
  # 为什么必须有这个 job（2026-09-24 的教训，代价是 8 个缺陷）：
  # `scripts/helpfixtures/` 里早就写好了四层池设计、采集脚本、回归脚本、diff 脚本，
  # 也**早就诊断出根因**——「池内回归全绿只证明『对池内那类 CLI 是对的』，不证明泛用性」。
  # 但 CI 一次都没调用过它们，池子目录一直是空的。
  # 结果：防缺陷的器械自己沦为孤岛，同类缺陷（多级子命令截断、分支语义缺失、
  # 占位符当词……）一个接一个地漏到真机上才暴露。
  #
  # 所以这个 job 的存在意义不是"多跑几条测试"，而是**把防缺陷机制接进必经之路**：
  # 改 `help_parse` 必须过这一关，池内条数对不上就红。
  help-parse-regress:
    name: help-parse 池回归
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lycore/target
          key: cargo-${{ runner.os }}-${{ hashFiles('lycore/Cargo.lock') }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release

      - name: 解析池里每一个 fixture
        # ⚠️ 固定口径，与 scripts/helpfixtures/README.md 一致：
        #   --include-writes（否则只看到只读子集）、--top 9999（不截断）
        run: |
          set -e
          BIN=target/release/lycore
          OUT=fixture-counts.txt
          : > "$OUT"
          for f in ../scripts/helpfixtures/fixtures/*.txt; do
            cli=$(basename "$f" .txt)
            n=$("$BIN" help-parse --cli "$cli" --help-text "$f" \
                --top 9999 --include-writes 2>/dev/null \
                | head -1 | grep -oE '解析出 [0-9]+ 条' | grep -oE '[0-9]+' || echo 0)
            echo "$cli $n" >> "$OUT"
          done
          echo "=== 本轮解析条数 ==="
          cat "$OUT"

      - name: 与基线比对
        run: |
          LOCK=../scripts/helpfixtures/fixtures.lock
          if [ ! -f "$LOCK" ]; then
            echo "::warning::fixtures.lock 不存在 —— 跳过比对，本次结果见 artifact（需人工固化基线）"
            cp fixture-counts.txt "$LOCK"
          else
            if ! diff -u "$LOCK" fixture-counts.txt; then
              echo "::error::help-parse 池内回归：解析条数与基线不一致。"
              echo "若为**有意**的改进（条数增加 / 占位符补齐），请更新 fixtures.lock；"
              echo "若为**无意**的破坏，必须回退重做。"
              exit 1
            fi
            echo "✅ 池内零回归"
          fi

      - name: 上传本轮条数
        uses: actions/upload-artifact@v4
        with:
          name: fixture-counts
          path: lycore/fixture-counts.txt
          if-no-files-found: error

  # 静态 musl 构建: 无 glibc 依赖 → 任意 aarch64 Linux 可跑。
  # 动机: gnu 二进制动态链 glibc≥2.39 (CI runner 24.04), 但 Radxa 主流镜像
  # (Ubuntu22.04=2.35 / Debian12=2.36) 更低 → 预编译跑不起来。musl 静态根治。
  # 用 cargo-zigbuild 交叉 (zig cc 自带 musl 目标, ring 可编; 手动 musl-gcc 缺 aarch64)。
  build-musl:
    name: Linux aarch64 (static musl)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: lycore
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-musl-${{ hashFiles('lycore/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install zig + cargo-zigbuild
        # Ubuntu 24.04 主仓库无 zig (E: Unable to locate package zig) → 直下官方 tarball。
        # 0.14.1 URL 已 curl -I 验证 200 (0.14.0 是 404, 勿改回)。
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf xz-utils
          ZV=0.14.1
          curl -sL "https://ziglang.org/download/$ZV/zig-x86_64-linux-$ZV.tar.xz" \
            | tar xJ -C /tmp
          echo "$(/bin/ls -d /tmp/zig-x86_64-linux-*/ | head -1)" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
      - name: Build (static)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl
      - name: Verify static
        run: file target/aarch64-unknown-linux-musl/release/lycore | grep -i "statically linked"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lycore-aarch64-static
          path: lycore/target/aarch64-unknown-linux-musl/release/lycore
          if-no-files-found: error

  release:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, build-musl]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lycore-aarch64-unknown-linux-gnu
          path: dist_dl
      - name: Download aarch64 static artifact
        uses: actions/download-artifact@v4
        with:
          name: lycore-aarch64-static
          path: dist_dl_static
      - name: Stage assets
        run: |
          mkdir -p out
          cp dist_dl/lycore out/lycore-aarch64
          chmod +x out/lycore-aarch64
          cp dist_dl_static/lycore out/lycore-aarch64-static
          chmod +x out/lycore-aarch64-static
          # 源码包: 已跟踪文件 (与 git archive HEAD 一致, 含演示知识包与训练脚本)
          git archive --format=tar.gz -o out/lyco_radxa_src.tar.gz HEAD
          ls -la out/
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag push 时 Release 尚不存在: 先 create (无资产, 直接发布), 已存在则跳过
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "自动构建: lycore-aarch64 (gnu) + lycore-aarch64-static (musl, 任意 aarch64 Linux 可跑) + 源码包。部署步骤详见 lyco-ops 仓 RADXA_SETUP.md (https://github.com/lilyco-42/lyco-ops)" \
            2>/dev/null || echo "release 已存在, 直接上传"
          gh release upload "$GITHUB_REF_NAME" \
            out/lycore-aarch64 out/lycore-aarch64-static out/lyco_radxa_src.tar.gz --clobber
