[basic]
log_level = "INFO"
pid_file = "/run/pingap.pid"

[servers.http]
addr = "0.0.0.0:80"
locations = ["force_https"]

[servers.https]
addr = "0.0.0.0:443"
enabled_h2 = true
global_certificates = true
locations = [
    "pet",
    "game_ws",
    "game_api",
    "game_assets",
    "game_support",
    "game_static",
    "game_live",
    "game_login",
    "game_token",
    "lyco",
    "compute",
    "gh_short",
    "workshop_plugin",
    "workshop_login",
    "workshop_admin",
    "workshop_api",
    "workshop",
    "panel",
    "panel_api",
    "panel_ws",
    "susong",
    "raid",
    "tool",
    "studio_api",
    "main",
    "incloud_api",
    "incloud",
    "signal",
]

[upstreams.compute_backend]
addrs = ["127.0.0.1:4601"]

[upstreams.game_backend]
addrs = ["127.0.0.1:4000"]

[upstreams.gh_short_backend]
addrs = ["127.0.0.1:4500"]

[upstreams.incloud_admin_backend]
addrs = ["127.0.0.1:4602"]

[upstreams.lyco_backend]
addrs = ["127.0.0.1:3300"]

[upstreams.panel_backend]
addrs = ["127.0.0.1:8010"]

[upstreams.panel_ws_backend]
addrs = ["127.0.0.1:10086"]

[upstreams.placeholder]
addrs = ["127.0.0.1:1"]

[upstreams.studio_billing_backend]
addrs = ["127.0.0.1:4700"]

[upstreams.workshop_backend]
addrs = ["127.0.0.1:4100"]

[locations.compute]
enable_reverse_proxy_headers = true
path = "/compute/"
upstream = "compute_backend"

[locations.force_https]
path = "/"
plugins = ["force_https_redirect"]

[locations.game_api]
enable_reverse_proxy_headers = true
path = "/game/turing/api"
rewrite = "^/game/turing/(.*) /$1"
upstream = "game_backend"

[locations.game_assets]
enable_reverse_proxy_headers = true
path = "/game/turing/assets"
plugins = ["game_dir"]
upstream = "placeholder"

[locations.game_live]
enable_reverse_proxy_headers = true
path = "/game/live"
plugins = [
    "game_fwd_auth",
    "game_live_dir",
]
rewrite = "^/game/live/([^/]+)(/play)?/?$ /game/live/$1/index.html"
upstream = "placeholder"

[locations.game_login]
enable_reverse_proxy_headers = true
path = "/game/login"
plugins = [
    "game_login_auth",
    "game_login_dir",
]
rewrite = "^/game/login(/.*)?$ /game/login/index.html"
upstream = "placeholder"

[locations.game_static]
enable_reverse_proxy_headers = true
path = "/game/turing"
plugins = ["game_dir"]
rewrite = "^/game/turing(/.*)?$ /game/turing/index.html"
upstream = "placeholder"

[locations.game_support]
enable_reverse_proxy_headers = true
path = "/game/turing/support"
plugins = ["game_dir"]
upstream = "placeholder"

[locations.game_token]
enable_reverse_proxy_headers = true
path = "/game/token"
plugins = ["game_token_auth"]
rewrite = "^/game/token /game_token"
upstream = "lyco_backend"

[locations.game_ws]
enable_reverse_proxy_headers = true
path = "/game/turing/ws"
rewrite = "^/game/turing/(.*) /$1"
upstream = "game_backend"

[locations.gh_short]
enable_reverse_proxy_headers = true
path = "/g/"
upstream = "gh_short_backend"

[locations.incloud]
enable_reverse_proxy_headers = true
path = "/incloud"
plugins = [
    "incloud_auth",
    "incloud_dir",
]
rewrite = "^/incloud/?$ /incloud/index.html"
upstream = "placeholder"

[locations.incloud_api]
enable_reverse_proxy_headers = true
path = "/incloud/api/"
plugins = ["incloud_auth"]
rewrite = "^/incloud/api/(.*) /api/$1"
upstream = "incloud_admin_backend"

[locations.lyco]
enable_reverse_proxy_headers = true
path = "/lyco"
rewrite = "^/lyco/?(.*)$ /$1"
upstream = "lyco_backend"

[locations.main]
enable_reverse_proxy_headers = true
path = "/"
plugins = ["studio_dir"]
rewrite = "^/sub/?$ /sub/index.html"
upstream = "placeholder"

[locations.panel]
enable_reverse_proxy_headers = true
path = "/panel"
rewrite = "^/panel/?(.*)$ /$1"
upstream = "panel_backend"

[locations.panel_api]
enable_reverse_proxy_headers = true
host = "lain42.top"
path = "/api"
upstream = "panel_backend"

[locations.panel_ws]
enable_reverse_proxy_headers = true
path = "/panel-ws"
upstream = "panel_ws_backend"

[locations.pet]
enable_reverse_proxy_headers = true
path = "/pet"
plugins = [
    "pet_dir",
    "pet_compress",
]
rewrite = "^/pet/?$ /pet/index.html"
upstream = "placeholder"

[locations.susong]
enable_reverse_proxy_headers = true
path = "/game/susong/web"
rewrite = "^/game/susong/web/?$ /game/susong/web/index.html"
plugins = ["studio_dir"]
upstream = "placeholder"

[locations.raid]
enable_reverse_proxy_headers = true
path = "/raid"
plugins = ["studio_dir"]
rewrite = "^/raid/?$ /raid/index.html"
upstream = "placeholder"

[locations.studio_api]
enable_reverse_proxy_headers = true
path = "/studio/api/"
rewrite = "^/studio/api/(.*) /api/$1"
upstream = "studio_billing_backend"

[locations.tool]
enable_reverse_proxy_headers = true
path = "/tool"
plugins = ["studio_dir"]
rewrite = "^/tool/((?:lyco/[^/]+/)?)$ /tool/${1}index.html"
upstream = "placeholder"

[locations.workshop]
enable_reverse_proxy_headers = true
host = "workshop.lain42.top"
path = "/"
plugins = ["workshop_dir"]
upstream = "placeholder"

[locations.workshop_admin]
enable_reverse_proxy_headers = true
host = "workshop.lain42.top"
path = "/admin"
plugins = ["workshop_dir"]
rewrite = "^/admin/?$ /admin/index.html"
upstream = "placeholder"

[locations.workshop_api]
enable_reverse_proxy_headers = true
host = "workshop.lain42.top"
path = "/api/"
rewrite = "^/api/(.*) /$1"
upstream = "workshop_backend"

[locations.workshop_login]
enable_reverse_proxy_headers = true
host = "workshop.lain42.top"
path = "/login"
plugins = ["workshop_dir"]
rewrite = "^/login/?$ /login/index.html"
upstream = "placeholder"

[locations.workshop_plugin]
enable_reverse_proxy_headers = true
host = "workshop.lain42.top"
path = "/plugin"
plugins = ["workshop_dir"]
rewrite = "^/plugin(/.*)?$ /index.html"
upstream = "placeholder"

[plugins.force_https_redirect]
category = "redirect"
http_to_https = true

[plugins.game_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/game-turing"

[plugins.game_fwd_auth]
auth_url = "http://127.0.0.1:3300/game_auth"
category = "forward_auth"

[plugins.game_jwt]
category = "jwt"
cookie = "game_token"
hide_credentials = true
secret = "lilyco42"

[plugins.game_live_auth]
authorizations = ["bHljbzpsYWluNDJMaWx5Y280Mg=="]
category = "basic_auth"
hide_credentials = true

[plugins.game_live_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/game-live"

[plugins.game_login_auth]
authorizations = ["bHljbzpsYWluNDJMaWx5Y280Mg=="]
category = "basic_auth"
hide_credentials = true

[plugins.game_login_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/game-login"

[plugins.game_token_auth]
authorizations = ["bHljbzpsYWluNDJMaWx5Y280Mg=="]
category = "basic_auth"
hide_credentials = true

[plugins.incloud_auth]
authorizations = ["bHljbzpsaWx5Y280Mg=="]
category = "basic_auth"
hide_credentials = true

[plugins.incloud_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/opt/incloud/web"

[plugins.pet_compress]
br_level = 11
category = "compression"
gzip_level = 9
min_length = 1024

[plugins.pet_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/pet"

[plugins.studio_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/studio"

[plugins.workshop_dir]
category = "directory"
charset = "utf-8"
index = "index.html"
path = "/var/www/dsh-workshop/current"

