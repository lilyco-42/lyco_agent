[package]
name = "lycore"
version = "0.1.0"
edition = "2021"
description = "lyco_agent Rust core: LVK knowledge pack retrieval, verifier cascade, agent tool executor"
license = "MIT"

[lib]
# `lib`   = Rust 侧集成（lycore 作为 crate 被引用）
# `cdylib` = 交叉编译成 Android 的 `liblycore.so`，供 APK 通过 JNI 消费。
#            交叉编译已验证可用（2026-09-23）：NDK 30 + `aarch64-linux-android24-clang`
#            编通全部依赖（ring / bundled SQLite / reqwest），约 1m30s。
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
# ring provider (交叉编译友好, 无需 cmake/aws-lc)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12.0"
# JNI 桥：APK 调 lycore 的确定性内核（解析/翻译/T1 门）。
# 非 Android 平台也会编译（这样 CI 能验证桥的代码正确性），但不加载 JVM。
jni = "0.21"

[dev-dependencies]
tempfile = "3"
