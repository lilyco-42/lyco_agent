[package]
name = "lycore"
version = "0.1.0"
edition = "2021"
description = "lyco_agent Rust core: LVK knowledge pack retrieval, verifier cascade, agent tool executor"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
# ring provider (交叉编译友好, 无需 cmake/aws-lc)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3"
